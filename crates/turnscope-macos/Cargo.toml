[package]
name = "turnscope-macos"
description = "Turnscope's menu bar app for macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# Not `Turnscope`: on a case-insensitive disk it would be the same file as
# the command line's `turnscope` in target/. The bundle names it
# Contents/MacOS/Turnscope.
[[bin]]
name = "turnscope-app"
path = "src/main.rs"

[dependencies]
# `tooling` draws the panel headless: the release binary draws it for `--snapshot`, which
# `scripts/check-app.sh` runs on a built app.
rune = { workspace = true, features = ["accessibility", "metal-backend", "svg", "tooling"] }
turnscope = { path = "../turnscope" }
block2 = "0.6"
jiff.workspace = true
libc = "0.2"
objc2 = "0.6"
# Without their default features, which are all of each framework: they
# linked CloudKit, CoreData, CoreImage, CoreLocation and Security.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSAppearance", "NSApplication", "NSAttributedString", "NSBezierPath", "NSBitmapImageRep", "NSButton", "NSColor", "NSColorList", "NSControl", "NSFont", "NSFontDescriptor", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSResponder", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSStringDrawing", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSAttributedString", "NSBundle", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSNotification", "NSObject", "NSOperation", "NSPathUtilities", "NSString", "NSURL", "NSUserDefaults"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
serde_json.workspace = true

[lints]
workspace = true

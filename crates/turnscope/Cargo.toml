[package]
name = "turnscope"
description = "The limits and usage of coding agents' accounts: the engine every app runs, the command line and the MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
jiff.workspace = true
notify = "8.2.0"
rayon = "1.12.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { version = "0.11.0", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package]
name = "turnscope"
description = "The limits, usage and sessions of the coding agents on this Mac: a CLI, an MCP server, and the menu bar app's daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Joey Chilson"]
repository = "https://github.com/joeychilson/turnscope"
publish = false

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
jiff = "0.2.37"
notify = "8.2.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

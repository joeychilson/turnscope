[workspace]
resolver = "3"
members = ["crates/engine", "crates/mcp", "crates/cli"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Joey Chilson"]
repository = "https://github.com/joeychilson/turnscope"
publish = false

[workspace.dependencies]
turnscope-engine = { path = "crates/engine" }
turnscope-mcp = { path = "crates/mcp" }
base64 = "0.23.1"
jiff = "0.2.37"
notify = "8.2.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Snowball's English stemmer, which search matches a word's other forms by.
rust-stemmers = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# SHA-256, which names the Keychain item Claude Code keeps a sign-in in for a
# folder of its own; already in the lockfile through another crate.
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
items_after_test_module = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

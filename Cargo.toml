[workspace]
members = ["crates/turnscope", "crates/turnscope-app"]
resolver = "3"

# One version for the engine, the command line and every app: a release is
# one version.
[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Joey Chilson"]
repository = "https://github.com/joeychilson/turnscope"
publish = false

[workspace.dependencies]
jiff = "0.2.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

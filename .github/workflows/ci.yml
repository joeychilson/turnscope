name: Verify

# Every push to main and every pull request, and each release before it is
# built (release.yml calls this).
#
# Actions are pinned to a commit, with its version beside it, so a tag moved
# upstream can't change what runs here; Dependabot proposes new ones. The
# runner is macOS 26 with Xcode 26, as the app's deployment target and its
# .icon and synchronized folders need; macos-latest would move on its own.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # A newer push to a pull request replaces its run; each commit on main
  # keeps its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # The engine, the MCP server and the command line.
  rust:
    runs-on: macos-26
    timeout-minutes: 30
    # Runners keep UTC, whose clocks never change, so the tests of days and
    # hours across a change of the clocks would pass without meeting one.
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The menu bar app: its kit's tests, which read the contract the Rust tests
  # write, and the app built as Xcode builds it, warnings as errors.
  app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/swiftpm
          key: swiftpm-${{ hashFiles('macos/Turnscope.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - run: swift test --package-path macos/TurnscopeKit
      - run: scripts/build.sh

  # The app as a release builds it, for both architectures, signed ad hoc,
  # and run: what a tag would publish, short of the Developer ID. A tag's
  # release builds it for real, so it skips this.
  release-build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/swiftpm
          key: swiftpm-${{ hashFiles('macos/Turnscope.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - run: scripts/release.sh
      - run: scripts/smoke.sh

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$tagged" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME and Cargo.toml's version, $declared, disagree."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. A release is made from a commit on main."
            exit 1
          fi
          # A draft left by a failed run is replaced when publishing; only a
          # published release stops it.
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null || true)
          if [ "$draft" = false ]; then
            echo "::error::$GITHUB_REF_NAME is already released. A published version is never changed; tag the next one."
            exit 1
          fi
      - name: Check the release notes
        run: |
          set -euo pipefail
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null
      - name: Check the secrets
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in DEVELOPER_ID_CERTIFICATE DEVELOPER_ID_PASSWORD NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER SPARKLE_PRIVATE_KEY SPARKLE_PUBLIC_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::There is no $name. A release is signed, notarized and offered to updates, or not made (scripts/sign-release.sh says what each is)."
              missing=1
            fi
          done
          exit "$missing"

  verify:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # The app, built on a runner that holds no secret, so nothing the build
  # runs, such as a dependency's build script, can reach a key.
  build:
    needs: [check, verify]
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"
      - run: rustup toolchain install
      - name: Build the app, unsigned
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: scripts/build-release.sh
      # An artifact keeps neither symlinks nor file modes, which the app's
      # framework needs, so the app goes in a zip that keeps both.
      - name: Pack the app
        run: ditto -c -k --keepParent target/dist/Turnscope.app "$RUNNER_TEMP/Turnscope.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-app
          path: ${{ runner.temp }}/Turnscope.zip
          if-no-files-found: error
          retention-days: 1

  # Signs, notarizes and publishes what build made. It builds nothing: while
  # the keys are here, only Apple's tools, Sparkle's sign_update and the
  # script's own check of the update's signature run.
  publish:
    needs: build
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-app
          path: ${{ runner.temp }}/unsigned
      - name: Unpack the app
        run: |
          mkdir -p target/dist
          ditto -x -k "$RUNNER_TEMP/unsigned/Turnscope.zip" target/dist
      # Before the keys are here, since resolving runs each package's
      # manifest, and only at the versions Package.resolved pins, since
      # Sparkle's sign_update is handed the update's private key.
      - name: Resolve Sparkle's tools
        run: |
          xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile \
            -project macos/Turnscope.xcodeproj -scheme Turnscope \
            -clonedSourcePackagesDirPath target/swiftpm -quiet
      - name: Set up signing
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
        run: |
          set -euo pipefail
          # A keychain of its own, for this run only, which codesign may use
          # without asking.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<< "$DEVELOPER_ID_CERTIFICATE" > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          keychains=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            keychains+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" ${keychains[@]+"${keychains[@]}"}
          # By its hash, which names exactly the one imported.
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::DEVELOPER_ID_CERTIFICATE holds no Developer ID Application identity."
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      # The notary and Sparkle keys are in this step's environment alone, and
      # the next step removes the notary key's file.
      - name: Sign, notarize and package
        env:
          NOTARY_P8: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          (umask 077 && printf '%s\n' "$NOTARY_P8" > "$RUNNER_TEMP/notary.p8")
          unset NOTARY_P8
          NOTARY_KEY="$RUNNER_TEMP/notary.p8" scripts/sign-release.sh
      # The keys go before the app runs: it was built where a dependency
      # could have changed it.
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
      # The signatures were verified and both files stapled; this runs the
      # app as it will ship.
      - name: Check the built app runs
        run: scripts/check-app.sh target/dist/Turnscope.app
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # A draft left by an earlier run of this workflow is replaced; a
          # release published is never touched.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | [.id, .draft] | @tsv" > "$RUNNER_TEMP/existing.tsv"
          while IFS=$'\t' read -r id draft; do
            if [ "$draft" != true ]; then
              echo "::error::$GITHUB_REF_NAME is already released. A published version is never changed; tag the next one."
              exit 1
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done < "$RUNNER_TEMP/existing.tsv"
          scripts/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Turnscope $version" --notes-file "$RUNNER_TEMP/notes.md" \
            "target/dist/Turnscope-$version.dmg" target/dist/appcast.xml
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
